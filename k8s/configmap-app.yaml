apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: techdomov
  labels:
    app.kubernetes.io/name: techdomov
    app.kubernetes.io/component: app
data:
  # Laravel
  APP_NAME: "Multishoping.eu"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://techdomov.eu"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  BCRYPT_ROUNDS: "12"

  # Logging
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "error"

  # Database
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-svc.techdomov.svc.cluster.local"
  DB_PORT: "3306"
  DB_DATABASE: "techdomov"
  DB_USERNAME: "techdomov"

  # Session
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_DOMAIN: ".techdomov.eu"

  # Broadcasting
  BROADCAST_CONNECTION: "log"

  # Filesystem
  FILESYSTEM_DISK: "local"

  # Queue + Cache → Redis
  QUEUE_CONNECTION: "redis"
  CACHE_STORE: "redis"
  REDIS_HOST: "redis-svc.techdomov.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"

  # Mail
  MAIL_MAILER: "smtp"
  MAIL_SCHEME: "ssl"
  MAIL_HOST: "smtp.zoner.com"
  MAIL_PORT: "465"
  MAIL_USERNAME: "postmaster@multishoping.eu"
  MAIL_FROM_ADDRESS: "postmaster@multishoping.eu"
  MAIL_FROM_NAME: "Multishoping.eu"

  # Company details
  COMPANY_NAME: "GASTRO ACS s.r.o."
  APP_ICO: "23756152"
  APP_DIC: "Nejsme plátci DPH"
  APP_ADDRESS: "Vítězné náměstí 576/1, Dejvice, 160 00 Praha"
  APP_PHONE: "+420 225 340 111"
  APP_EMAIL: "info@techdomov.eu"
  APP_BUSINESS_EMAIL: "firmy@techdomov.eu"
  APP_PHARMACY_EMAIL: "lekarna@techdomov.eu"
  APP_DAMAGE_EMAIL: "poskozeni@techdomov.eu"
  APP_CLAIM_EMAIL: "reklamace@techdomov.eu"
  APP_GDPR_EMAIL: "gdpr@techdomov.eu"
  APP_RETURN_ADDRESS: "Vítězné náměstí 576/1, Dejvice, 160 00 Praha"
  APP_VOP_DATE: "27. 3. 2026"

  # E-shop config
  ADMIN_ID: "1"
  ESHOP_NAME: "tdEshop"
  DEVELOPER_URL: "www.ozelina.eu"
  DEVELOPER_NAME: "Ondrej Zelina"
  FACEBOOK_URL: "https://cs-cz.facebook.com/ondrej.zelina.77"
  LINKEDIN_URL: "https://www.linkedin.com/in/ond%C5%99ej-zelina-858159273/"

  # Vite
  VITE_APP_NAME: "Multishoping.eu"

  # PayPal mode
  PAYPAL_MODE: "live"
