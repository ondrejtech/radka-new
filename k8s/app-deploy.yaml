apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: techdomov
  labels:
    app.kubernetes.io/name: techdomov
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: fpm
  selector:
    app.kubernetes.io/name: techdomov
    app.kubernetes.io/component: app

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: techdomov
  labels:
    app.kubernetes.io/name: techdomov
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: techdomov
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: techdomov
        app.kubernetes.io/component: app
    spec:
      # Init container: ensure storage directory structure before app starts
      initContainers:
        - name: init-storage
          image: registry.multishoping.eu/techdomov-app:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              mkdir -p \
                storage/app/public \
                storage/framework/cache/data \
                storage/framework/sessions \
                storage/framework/views \
                storage/logs
              chown -R www-data:www-data storage bootstrap/cache
              chmod -R 775 storage bootstrap/cache
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
      containers:
        - name: php-fpm
          image: registry.multishoping.eu/techdomov-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: fpm
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            # Override DB_HOST without the .svc.cluster.local suffix for
            # compat with the nginx nginx.conf which references "app:9000".
            # DNS resolves <service>.<namespace>.svc.cluster.local automatically.
            - name: REDIS_HOST
              value: "redis-svc.techdomov.svc.cluster.local"
            - name: DB_HOST
              value: "mysql-svc.techdomov.svc.cluster.local"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: app-storage
