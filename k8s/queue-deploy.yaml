apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: techdomov
  labels:
    app.kubernetes.io/name: techdomov
    app.kubernetes.io/component: queue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: techdomov
      app.kubernetes.io/component: queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: techdomov
        app.kubernetes.io/component: queue
    spec:
      initContainers:
        - name: init-storage
          image: registry.multishoping.eu/techdomov-app:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              mkdir -p \
                storage/app/public \
                storage/framework/cache/data \
                storage/framework/sessions \
                storage/framework/views \
                storage/logs
              chown -R www-data:www-data storage bootstrap/cache
              chmod -R 775 storage bootstrap/cache
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
      containers:
        - name: queue-worker
          image: registry.multishoping.eu/techdomov-app:latest
          imagePullPolicy: Always
          args:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --timeout=90
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: REDIS_HOST
              value: "redis-svc.techdomov.svc.cluster.local"
            - name: DB_HOST
              value: "mysql-svc.techdomov.svc.cluster.local"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: app-storage
